# Mouse support
set -g mouse on

# Change prefix
# unbind <prefix>
# set -g prefix <new-prefix>
# bind <new-prefix> send-prefix

# Custom bindings
bind -n M-H previous-window
bind -n M-L next-window

# 1-index window numbering
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # This removes some quirks of tmux apparently
set -g @plugin 'catppuccin/tmux'                 # Catpuccin theme
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

set -g @plugin 'tmux-plugins/tmux-resurrect'     # Manual tmux session save & restore
set -g @plugin 'tmux-plugins/tmux-continuum'     # Automatic 
set -g @continuum-restore 'on'                   # Auto-restore on `tmux server start`
set -g @continuum-save-interval '12'             # Auto-save every 12 mins (default 15)

# Initialize tpm (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
